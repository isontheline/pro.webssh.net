name: Validate State Bar Library

on:
  pull_request:
    paths:
      - "statebar/**"
      - ".github/scripts/validate_statebar.py"
      - ".github/workflows/validate_statebar.yml"
  push:
    branches: [master]
    paths:
      - "statebar/**"
      - ".github/scripts/validate_statebar.py"
      - ".github/workflows/validate_statebar.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The `runner` context does not exist at job level: the folder is
      # shared with the next step through GITHUB_ENV.
      - name: Validate manifests, scripts and index
        run: |
          echo "RENDERED_DIR=$RUNNER_TEMP/rendered-statebar" >> "$GITHUB_ENV"
          RENDERED_DIR="$RUNNER_TEMP/rendered-statebar" python3 .github/scripts/validate_statebar.py

      # Each script is checked once its {{{ VARIABLE }}} placeholders are
      # replaced by their default value: that is what the app executes.
      - name: JavaScript syntax (node --check)
        run: |
          status=0
          while IFS= read -r -d '' file; do
            node --check "$file" || status=1
          done < <(find "$RENDERED_DIR" -name '*.js' -print0)
          exit $status
