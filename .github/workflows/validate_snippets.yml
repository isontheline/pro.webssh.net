name: Validate Snippets

on:
  pull_request:
    paths:
      - "snippets/**"
  push:
    branches: [master]
    paths:
      - "snippets/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifests, listings and index
        run: |
          python3 - <<'EOF'
          import json, os, re, sys

          ROOT = "snippets"
          MAX_SIZE = 1024
          OS_VALUES = {"linux", "macos", "windows", "freebsd", "openbsd"}
          USERNAME = re.compile(r"[A-Za-z0-9](?:[A-Za-z0-9]|-(?=[A-Za-z0-9])){0,38}$")
          # SF Symbols names: dot-separated lowercase segments (e.g.
          # "externaldrive.badge.checkmark"). Existence can't be checked on
          # Linux — the app falls back to a default icon for unknown names.
          SF_SYMBOL = re.compile(r"[a-z0-9]+(?:\.[a-z0-9]+)*$")
          # Only two snippet kinds exist, each with its own validator: .sh
          # (ShellCheck) and .ks key sequences. Anything else could smuggle
          # an unreviewed command past ShellCheck.
          ALLOWED_EXTENSIONS = {".sh", ".ks"}
          # <ctrl-x> tokens the app expands; ctrl-j (LF) and ctrl-m (CR) are
          # banned — with no newline allowed either, a .ks can TYPE text but
          # never EXECUTE it: the user always presses Enter themself.
          KS_TOKEN = re.compile(r"<ctrl-[a-ik-ln-z]>")
          KS_MAX_SIZE = 64
          KS_MAX_LITERAL = 16

          def check_key_sequence(scope, path):
              data = open(path, "rb").read()
              if len(data) > KS_MAX_SIZE:
                  errors.append(f"{scope}: key sequence exceeds {KS_MAX_SIZE} bytes")
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  return  # already reported by the generic UTF-8 check
              if "\n" in text or "\r" in text:
                  errors.append(f"{scope}: .ks must be a single line with NO trailing newline (a newline would auto-execute the typed text)")
              if not KS_TOKEN.search(text):
                  errors.append(f"{scope}: .ks must contain at least one <ctrl-x> token (a-z, except ctrl-j/ctrl-m)")
              literal = KS_TOKEN.sub("", text)
              if re.search(r"<ctrl-[^>]*>", literal):
                  errors.append(f"{scope}: unknown or banned <ctrl-...> token (ctrl-j/ctrl-m are Enter — not allowed)")
              elif len(literal) > KS_MAX_LITERAL:
                  errors.append(f"{scope}: too much literal text around the tokens ({len(literal)} > {KS_MAX_LITERAL} chars) — write a .sh snippet instead")
          errors = []

          def check_maintainers(scope, meta):
              maintainers = (meta or {}).get("maintainers", [])
              if not isinstance(maintainers, list):
                  errors.append(f"{scope}: 'maintainers' must be an array of GitHub usernames")
                  return
              for username in maintainers:
                  if not isinstance(username, str) or not USERNAME.match(username):
                      errors.append(f"{scope}: invalid GitHub username '{username}' in maintainers")

          collections = [d for d in sorted(os.listdir(ROOT))
                         if os.path.isdir(os.path.join(ROOT, d)) and not d.startswith(".")]

          for coll in collections:
              base = os.path.join(ROOT, coll)
              manifest_path = os.path.join(base, "webssh.json")
              if not os.path.isfile(manifest_path):
                  errors.append(f"{coll}: missing webssh.json")
                  continue
              try:
                  manifest = json.load(open(manifest_path, encoding="utf-8"))
              except Exception as e:
                  errors.append(f"{coll}/webssh.json: invalid JSON ({e})")
                  continue

              if manifest.get("version") != 1:
                  errors.append(f"{coll}/webssh.json: 'version' must be exactly 1 (current schema)")

              files = manifest.get("files")
              if not isinstance(files, dict) or not files:
                  errors.append(f"{coll}/webssh.json: 'files' must be a non-empty object")
                  continue

              on_disk = {f for f in os.listdir(base)
                         if os.path.isfile(os.path.join(base, f)) and f != "webssh.json"}

              for name, meta in files.items():
                  if name not in on_disk:
                      errors.append(f"{coll}: manifest lists '{name}' but the file is missing")
                      continue
                  extension = os.path.splitext(name)[1].lower()
                  if extension not in ALLOWED_EXTENSIONS:
                      errors.append(f"{coll}/{name}: extension '{extension}' not allowed — .sh (ShellCheck) or .ks (key sequence) only")
                  elif extension == ".ks":
                      check_key_sequence(f"{coll}/{name}", os.path.join(base, name))
                  size = os.path.getsize(os.path.join(base, name))
                  if size > MAX_SIZE:
                      errors.append(f"{coll}/{name}: {size} bytes exceeds the 1 KB limit")
                  try:
                      open(os.path.join(base, name), encoding="utf-8").read()
                  except UnicodeDecodeError:
                      errors.append(f"{coll}/{name}: not valid UTF-8 text")
                  for osv in (meta or {}).get("os", []):
                      if osv not in OS_VALUES:
                          errors.append(f"{coll}/{name}: unknown os value '{osv}'")
                  examples = (meta or {}).get("examples")
                  if examples is not None:
                      if not isinstance(examples, list) or len(examples) > 15:
                          errors.append(f"{coll}/{name}: 'examples' must be an array of at most 15 objects")
                      else:
                          for i, example in enumerate(examples):
                              if not isinstance(example, dict) \
                                 or not isinstance(example.get("command"), str) \
                                 or not example["command"].strip() \
                                 or len(example["command"]) > 200 \
                                 or not isinstance(example.get("comment", ""), str):
                                  errors.append(f"{coll}/{name}: examples[{i}] must be {{\"command\": \"...\" (non-empty, <= 200 chars), \"comment\": \"...\" (optional)}}")
                  for flag in ("danger", "root"):
                      value = (meta or {}).get(flag)
                      if value is not None and not isinstance(value, bool):
                          errors.append(f"{coll}/{name}: '{flag}' must be a boolean")
                  display_name = (meta or {}).get("name")
                  if display_name is not None and (not isinstance(display_name, str) or not display_name.strip()):
                      errors.append(f"{coll}/{name}: 'name' must be a non-empty string")
                  icon = (meta or {}).get("icon")
                  if icon is not None and (not isinstance(icon, str) or not SF_SYMBOL.match(icon)):
                      errors.append(f"{coll}/{name}: 'icon' must be an SF Symbols name (lowercase, dot-separated)")
                  check_maintainers(f"{coll}/{name}", meta)

              for name in sorted(on_disk - set(files)):
                  errors.append(f"{coll}: '{name}' exists but is not listed in webssh.json (invisible in-app)")

              if "collection" in manifest:
                  errors.append(f"{coll}/webssh.json: 'collection' is no longer part of the schema — os/maintainers are per-file only")

          # index.md: every collection link must point to an existing folder.
          # HTML comment blocks document the format — skip them, like the app.
          index = open(os.path.join(ROOT, "index.md"), encoding="utf-8").read()
          index = re.sub(r"<!--.*?-->", "", index, flags=re.S)
          linked = set()
          for match in re.finditer(r"\]\(([^)\s]+)\)", index):
              url = match.group(1)
              m = re.match(r"https://github\.com/isontheline/pro\.webssh\.net/tree/master/snippets/([^)#?]+)", url)
              slug = None
              if m:
                  slug = m.group(1).strip("/")
              elif re.fullmatch(r"\.?/?[A-Za-z0-9_/-]+/?", url) and "." not in url:
                  slug = url.strip("./").strip("/")
              if slug:
                  linked.add(slug)
                  if not os.path.isdir(os.path.join(ROOT, slug)):
                      errors.append(f"index.md: linked collection '{slug}' does not exist")

          for coll in collections:
              if coll not in linked:
                  print(f"::warning::collection '{coll}' is not referenced by index.md")

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          print(f"OK — {len(collections)} collection(s) validated")
          EOF

      - name: ShellCheck (errors are blocking)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          find snippets -name "*.sh" -print0 | xargs -0 -r shellcheck -S error -s bash

      - name: ShellCheck (style report, non-blocking)
        continue-on-error: true
        run: |
          find snippets -name "*.sh" -print0 | xargs -0 -r shellcheck -s bash
